name: Android APK

on:
  push:
    branches: ['refactor/ptoart-20261023']
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android
        env:
          PTOART_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '0.2.0-dev' }}
          PTOART_VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease
      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/ptoart-android.apk
          cd dist && sha256sum ptoart-android.apk > SHA256SUMS-android.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ptoart-android-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 30
