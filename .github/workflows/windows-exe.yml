name: Windows EXE

on:
  push:
    branches: ['refactor/ptoart-20261023']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      TF_CPP_MIN_LOG_LEVEL: '2'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: packaging/requirements-windows.txt
      - name: Install CPU runtime and build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r packaging/requirements-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip freeze > build-dependencies.txt
      - name: Run regression tests
        run: python -m pytest -q
      - name: Build portable console EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --console --noupx --name ptoart --paths . --collect-all face_alignment --collect-all onnxruntime --hidden-import face_alignment.detection.sfd --hidden-import utils.preprocess --hidden-import utils.face_seg --hidden-import models.networks --copy-metadata face-alignment --collect-all customtkinter --hidden-import ptoart.gui --exclude-module matplotlib --exclude-module IPython --exclude-module pytest packaging/windows_entry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify frozen executable outside source tree
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist/ptoart/ptoart.exe).Path
          Push-Location $env:RUNNER_TEMP
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw 'EXE version failed' }
          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw 'EXE help failed' }
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Frozen runtime self-test failed' }
          $shot = "$env:GITHUB_WORKSPACE/gui-screenshot.png"
          $env:PTOART_GUI_LOG = "$env:RUNNER_TEMP/gui.log"
          & $exe --gui-screenshot $shot *> "$env:RUNNER_TEMP/gui-out.log"
          $code = $LASTEXITCODE
          if ($code -ne 0 -or -not (Test-Path $shot)) {
            Get-Content "$env:RUNNER_TEMP/gui-out.log", "$env:RUNNER_TEMP/gui.log" -ErrorAction SilentlyContinue |
              Select-Object -Last 40 | ForEach-Object { Write-Output "::error::GUI: $_" }
            throw "GUI failed to start (exit $code)"
          }
          & $exe doctor --aligned --device cpu --model-dir "$env:RUNNER_TEMP/ptoart-no-models"
          if ($LASTEXITCODE -ne 2) { throw 'Missing models must return exit code 2' }
          Pop-Location
          # GitHub's pwsh wrapper propagates the last native exit code. The
          # doctor exit code 2 above is expected, not a failed smoke test.
          $global:LASTEXITCODE = 0
      - uses: actions/upload-artifact@v4
        with:
          name: gui-screenshot
          path: gui-screenshot.png
          retention-days: 7
      - name: Bundle face-detector weights (no download at first run)
        shell: pwsh
        run: |
          $env:TORCH_HOME = "$env:GITHUB_WORKSPACE/dist/ptoart/weights/torch"
          python -c "import face_alignment as fa; fa.FaceAlignment(fa.LandmarksType.TWO_D, device='cpu', face_detector='sfd')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist/ptoart/weights/torch/hub/checkpoints
          @'
          face_alignment detector weights (S3FD, 2DFAN4) from https://github.com/1adrianb/face-alignment
          (BSD 3-Clause). Bundled so the app never downloads them at first run.
          '@ | Set-Content dist/ptoart/weights/torch/README.txt
      - name: Assemble portable ZIP and checksum
        shell: pwsh
        run: |
          Copy-Item packaging/WINDOWS-README.md dist/ptoart/README-WINDOWS.md
          Copy-Item LICENSE dist/ptoart/LICENSE
          Copy-Item docs/MODELS.md dist/ptoart/MODELS.md
          Copy-Item docs/QUICKSTART.md dist/ptoart/QUICKSTART.md
          Copy-Item packaging/windows-bat/*.bat dist/ptoart/
          Copy-Item build-dependencies.txt dist/ptoart/build-dependencies.txt
          New-Item -ItemType Directory -Force dist/ptoart/weights | Out-Null
          'Put ptoart_weights.pt and seg_model_384.pb here, unzip ptoart-styles.zip and ptoart-dctnet.zip into styles\ and the upscalers into upscale\. The torch folder (face detector) is already included; do not delete it.' | Set-Content dist/ptoart/weights/README.txt
          "Source commit: $env:GITHUB_SHA" | Set-Content dist/ptoart/BUILD.txt
          Compress-Archive -Path dist/ptoart -DestinationPath dist/ptoart-windows-x64.zip -CompressionLevel Optimal
          $hash = (Get-FileHash dist/ptoart-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  ptoart-windows-x64.zip" | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ptoart-windows-x64
          path: |
            dist/ptoart-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Build summary
        shell: pwsh
        run: |
          @'
          ## Windows x64 CPU portable package (GUI)
          Download **ptoart-windows-x64** under this run's Artifacts and extract both ZIP layers.
          Keep `ptoart.exe` together with the `_internal` folder; no Python installation is required.
          No official model weights are bundled. SFD is the default detector; dlib and CUDA are not included.
          Frozen random-weight inference and synthetic segmentation passed; real-photo official-weight end-to-end inference is not validated.
          Double-click ptoart.exe to open the GUI; see README-WINDOWS.md in the package.
          '@ >> $env:GITHUB_STEP_SUMMARY

  screenshot:
    # Publish the GUI screenshot to the ci-artifacts branch so it can be reviewed without
    # downloading artifacts (development branch pushes only).
    needs: build
    if: github.ref == 'refs/heads/refactor/ptoart-20261023'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gui-screenshot
      - name: Push to ci-artifacts branch
        run: |
          mkdir pub && mv gui-screenshot.png pub/ && cd pub
          git init -q -b ci-artifacts
          git config user.name github-actions && git config user.email actions@github.com
          git add gui-screenshot.png && git commit -qm "GUI screenshot for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-artifacts
